# dbt project for the warehouse layers after raw (spec 0001).
# Run it through Make, which exports DBT_DUCKDB_PATH:
#
#     make dbt-build
name: ecommerce_event_pipeline
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.12.0", "<1.13.0"]

profile: ecommerce_event_pipeline

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

# Every model is a table and covers every load (spec 0001): the warehouse is local
# and small, and a table is what the DuckDB MCP server and the DuckDB UI can read.
models:
  ecommerce_event_pipeline:
    +materialized: table
    staging:
      +schema: staging
    marts:
      +schema: marts
