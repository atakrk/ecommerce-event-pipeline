# Ruff lint + format on every commit. Install the hook once with:
#
#     uv run pre-commit install
#
# Keep `rev` in step with the ruff version pinned in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
