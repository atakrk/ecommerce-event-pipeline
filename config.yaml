seed: 42

paths:
  data_dir: data

users:
  count: 10000
  created_at_range: {start: "2024-01-01", end: "2025-12-31"}
  device_types: {mobile: 0.60, desktop: 0.30, tablet: 0.10}   # weights
  countries:                                                  # weight + cities
    TR: {weight: 0.40, cities: [Istanbul, Ankara, Izmir, Bursa, Antalya]}
    DE: {weight: 0.25, cities: [Berlin, Munich, Hamburg, Cologne]}
    GB: {weight: 0.20, cities: [London, Manchester, Birmingham]}
    NL: {weight: 0.15, cities: [Amsterdam, Rotterdam, Utrecht]}

products:
  count: 1000
  categories:                                                 # weight + price range
    electronics: {weight: 0.20, price_min: 50, price_max: 2000}
    fashion:     {weight: 0.30, price_min: 10, price_max: 300}
    home:        {weight: 0.20, price_min: 15, price_max: 800}
    beauty:      {weight: 0.15, price_min: 5,  price_max: 150}
    sports:      {weight: 0.15, price_min: 10, price_max: 600}

# Used in step 2 (event generation).
simulation:
  start: "2026-09-01T00:00:00Z"  # first possible session start, ISO 8601 UTC; --start overrides it
  window_hours: 24               # session start times are spread uniformly across this window

# Steps: page_view -> product_view -> add_to_cart -> checkout -> purchase
# Each rate is the probability of moving on from the previous step.
# Overall: ~9% of sessions add to cart, ~2.7% purchase.
funnel:
  page_view_to_product_view: 0.60
  product_view_to_add_to_cart: 0.15
  add_to_cart_to_checkout: 0.50
  checkout_to_purchase: 0.60
